<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics – heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-i18n="nav.challenges" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.scoreboard" href="/scoreboard">Scoreboard</a></li>
          <li class="nav-item"><a class="nav-link active" data-i18n="nav.statistics" href="/statistics">Statistics</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" id="nav-admin" style="display:none"><a class="nav-link" data-i18n="nav.admin" href="/admin">Admin</a></li>
          <li class="nav-item" id="nav-profile-li" style="display:none"><a class="nav-link" href="/profile" id="nav-profile">Profile</a></li>
          <li class="nav-item" id="nav-login-li"><a class="nav-link" data-i18n="nav.login" href="/login">Login</a></li>
          <li class="nav-item" id="nav-register-li"><a class="nav-link" data-i18n="nav.register" href="/register">Register</a></li>
          <li class="nav-item" id="nav-logout-li" style="display:none"><a class="nav-link" data-i18n="nav.logout" href="#" onclick="logout()">Logout</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><span id="lang-toggle-label">EN</span></a>
            <ul class="dropdown-menu dropdown-menu-end" style="min-width:120px">
              <li><a class="dropdown-item" href="#" onclick="setLang('en');return false">English</a></li>
              <li><a class="dropdown-item" href="#" onclick="setLang('ru');return false">Русский</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <h1 class="page-title" data-i18n="statistics.title">Statistics</h1>

    <!-- Summary cards -->
    <div class="row g-3 mb-4" id="stats-summary">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="stat-users">–</div>
          <div class="stat-label" data-i18n="statistics.total_users">Total Users</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="stat-challenges">–</div>
          <div class="stat-label" data-i18n="statistics.total_challenges">Challenges</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="stat-correct">–</div>
          <div class="stat-label" data-i18n="statistics.correct_submissions">Correct Submissions</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">–</div>
          <div class="stat-label" data-i18n="statistics.total_submissions">Total Submissions</div>
        </div>
      </div>
    </div>

    <!-- Category breakdown -->
    <div class="card">
      <div class="card-header" data-i18n="statistics.categories">Category Breakdown</div>
      <div class="card-body p-0">
        <table class="admin-table" id="category-table">
          <thead>
            <tr>
              <th data-i18n="statistics.category">Category</th>
              <th data-i18n="statistics.challenge_count">Challenges</th>
              <th data-i18n="statistics.solve_count">Correct Solves</th>
            </tr>
          </thead>
          <tbody id="category-body">
            <tr><td colspan="3" class="text-center py-4 text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/statistics.js"></script>
  <script>
    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }
    (async () => {
      await initI18n();
      const user = await getMe();
      if (user) {
        document.getElementById('nav-profile').textContent = user.username;
        document.getElementById('nav-profile-li').style.display = '';
        document.getElementById('nav-login-li').style.display = 'none';
        document.getElementById('nav-register-li').style.display = 'none';
        document.getElementById('nav-logout-li').style.display = '';
        if (user.role === 'admin') document.getElementById('nav-admin').style.display = '';
      }
      loadStatistics();
    })();
  </script>
</body>
</html>
