<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User – heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-i18n="nav.challenges" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.modules" href="/modules">Modules</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.scoreboard" href="/scoreboard">Scoreboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" data-i18n="nav.admin" href="/admin">Admin</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.profile" href="/profile">Profile</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.logout" href="#" onclick="logout()">Logout</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><span id="lang-toggle-label">EN</span></a>
            <ul class="dropdown-menu dropdown-menu-end" style="min-width:120px">
              <li><a class="dropdown-item" href="#" onclick="setLang('en');return false">English</a></li>
              <li><a class="dropdown-item" href="#" onclick="setLang('ru');return false">Русский</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <div class="mb-3">
      <a href="/admin" class="btn btn-secondary btn-sm" data-i18n="admin.back_to_users">← Back to Users</a>
    </div>
    <h1 class="page-title" data-i18n="admin.user_detail">Edit User</h1>

    <div id="user-loading" class="loading-spinner">
      <div class="spinner-border text-secondary" role="status"></div>
    </div>

    <div id="user-content" style="display:none">
      <!-- Main form -->
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card p-4 mb-4">
            <form id="user-form" onsubmit="saveUser(event)">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label" data-i18n="login.username">Username</label>
                  <input type="text" class="form-control" id="u-username" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" data-i18n="register.email">Email</label>
                  <input type="email" class="form-control" id="u-email">
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label" data-i18n="login.password">Password</label>
                  <input type="text" class="form-control" id="u-password" data-i18n-placeholder="admin.user_password_hint" placeholder="Leave blank to keep unchanged">
                </div>
                <div class="col-md-6">
                  <label class="form-label" data-i18n="admin.user_language">Language</label>
                  <input type="text" class="form-control" id="u-language" placeholder="en">
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-4">
                  <label class="form-label" data-i18n="admin.user_role">Role</label>
                  <select class="form-select" id="u-role">
                    <option value="user">user</option>
                    <option value="admin">admin</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" data-i18n="admin.user_score">Score</label>
                  <input type="number" class="form-control" id="u-score" value="0">
                </div>
                <div class="col-md-4">
                  <label class="form-label" data-i18n="admin.user_affiliation">Affiliation</label>
                  <input type="text" class="form-control" id="u-affiliation">
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label" data-i18n="admin.user_website">Website</label>
                  <input type="text" class="form-control" id="u-website">
                </div>
                <div class="col-md-6">
                  <label class="form-label" data-i18n="admin.user_country">Country</label>
                  <input type="text" class="form-control" id="u-country">
                </div>
              </div>
              <div class="d-flex gap-4 mb-3 flex-wrap">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="u-verified">
                  <label class="form-check-label" for="u-verified" data-i18n="admin.user_verified">Verified</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="u-hidden">
                  <label class="form-check-label" for="u-hidden" data-i18n="admin.user_hidden">Hidden</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="u-banned">
                  <label class="form-check-label" for="u-banned" data-i18n="admin.user_banned">Banned</label>
                </div>
              </div>
              <div id="user-error" class="alert alert-danger d-none"></div>
              <div id="user-success" class="alert alert-success d-none"></div>
              <button type="submit" class="btn btn-primary" data-i18n="admin.user_save">Save User</button>
            </form>
          </div>

          <!-- Custom fields -->
          <div class="card p-4 mb-4" id="custom-fields-section" style="display:none">
            <h5 class="mb-3" data-i18n="admin.user_custom_fields">Custom Fields</h5>
            <div id="custom-fields-list"></div>
            <button class="btn btn-secondary btn-sm mt-2" onclick="saveCustomFields()">Save Custom Fields</button>
          </div>
        </div>

        <div class="col-lg-4">
          <!-- Actions -->
          <div class="card p-4 mb-4">
            <h6 class="mb-3 text-muted text-uppercase" style="font-size:.75rem;letter-spacing:.06em">Actions</h6>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-secondary" onclick="doResetScore()" data-i18n="admin.user_reset_score">Reset Score</button>
              <button class="btn btn-danger" onclick="doDeleteUser()" data-i18n="admin.user_delete">Delete User</button>
            </div>
          </div>

          <!-- Submissions -->
          <div class="card p-4">
            <h6 class="mb-3 text-muted text-uppercase" style="font-size:.75rem;letter-spacing:.06em" data-i18n="admin.user_submissions">Submissions</h6>
            <div id="submissions-list" class="text-muted" style="font-size:.875rem;max-height:350px;overflow-y:auto">Loading…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/admin-user.js"></script>
  <script>
    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login';
    }
    (async () => {
      await initI18n();
      const user = await getMe();
      if (!user || user.role !== 'admin') { location.href = '/'; return; }
      initAdminUser();
    })();
  </script>
</body>
</html>
