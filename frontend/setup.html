<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initial setup - heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card setup-card">
      <div class="auth-logo"><span>heCsTackForse</span></div>
      <h2>Initial setup</h2>
      <p class="setup-muted">Create the first administrator and choose the basic competition settings.</p>
      <div id="setup-error" class="alert alert-danger d-none"></div>
      <form id="setup-form">
        <div class="mb-3">
          <label class="form-label" for="site-name">Competition name</label>
          <input class="form-control" id="site-name" name="site_name" value="heCsTackForse CTF" required>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="mode">Mode</label>
            <select class="form-select" id="mode" name="mode">
              <option value="ctf">Classic CTF</option>
              <option value="ad">Attack & Defence</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="language">Default language</label>
            <select class="form-select" id="language" name="language">
              <option value="en">English</option>
              <option value="ru">Russian</option>
            </select>
          </div>
        </div>
        <div class="form-check form-switch mt-3">
          <input class="form-check-input" type="checkbox" role="switch" id="registration-open" checked>
          <label class="form-check-label" for="registration-open">Open registration after setup</label>
        </div>
        <div class="form-check form-switch mt-2 mb-4">
          <input class="form-check-input" type="checkbox" role="switch" id="team-mode">
          <label class="form-check-label" for="team-mode">Use team mode</label>
        </div>

        <div class="setup-section-title">Administrator</div>
        <div class="mb-3">
          <label class="form-label" for="admin-username">Username</label>
          <input class="form-control" id="admin-username" name="admin_username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="admin-email">Email</label>
          <input type="email" class="form-control" id="admin-email" name="admin_email" autocomplete="email" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="admin-password">Password</label>
          <input type="password" class="form-control" id="admin-password" name="admin_password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Finish setup</button>
      </form>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script>
    (async () => {
      const status = await apiFetch('/api/setup/status').catch(() => ({ required: false }));
      if (!status.required) window.location.href = '/';
    })();

    document.getElementById('setup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('setup-error');
      error.classList.add('d-none');
      const payload = {
        site_name: document.getElementById('site-name').value,
        mode: document.getElementById('mode').value,
        language: document.getElementById('language').value,
        registration_open: document.getElementById('registration-open').checked,
        team_mode: document.getElementById('team-mode').checked,
        admin_username: document.getElementById('admin-username').value,
        admin_email: document.getElementById('admin-email').value,
        admin_password: document.getElementById('admin-password').value,
      };
      try {
        await apiFetch('/api/setup', { method: 'POST', body: JSON.stringify(payload) });
        window.location.href = '/admin';
      } catch (err) {
        error.textContent = err.message || 'Setup failed';
        error.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
