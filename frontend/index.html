<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heCsTackForse CTF</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-i18n="nav.challenges" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.modules" href="/modules">Modules</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.scoreboard" href="/scoreboard">Scoreboard</a></li>
          <li class="nav-item" id="nav-notifications-li" style="display:none">
            <a class="nav-link bell-indicator" href="/notifications"><span aria-hidden="true">🔔</span> <span data-i18n="nav.notifications">Notifications</span></a>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" id="nav-admin" style="display:none"><a class="nav-link" data-i18n="nav.admin" href="/admin">Admin</a></li>
          <li class="nav-item" id="nav-profile-li" style="display:none"><a class="nav-link" href="/profile" id="nav-profile">Profile</a></li>
          <li class="nav-item" id="nav-login-li"><a class="nav-link" data-i18n="nav.login" href="/login">Login</a></li>
          <li class="nav-item" id="nav-register-li"><a class="nav-link" data-i18n="nav.register" href="/register">Register</a></li>
          <li class="nav-item" id="nav-logout-li" style="display:none"><a class="nav-link" data-i18n="nav.logout" href="#" onclick="logout()">Logout</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><span id="lang-toggle-label">EN</span></a>
            <ul class="dropdown-menu dropdown-menu-end" style="min-width:120px">
              <li><a class="dropdown-item" href="#" onclick="setLang('en');return false">English</a></li>
              <li><a class="dropdown-item" href="#" onclick="setLang('ru');return false">Русский</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="ctf-hero">
    <h1 data-i18n="index.hero_title">Capture the Flag</h1>
    <p data-i18n="index.hero_sub">Compete, learn, and conquer challenges.</p>
    <div class="d-flex gap-3 flex-wrap justify-content-center">
      <a href="/challenges" class="btn btn-primary btn-lg px-4" data-i18n="index.go_challenges">View Challenges</a>
      <a href="/register" class="btn btn-outline-primary btn-lg px-4" id="hero-register" data-i18n="index.register_now">Register Now</a>
    </div>
  </div>

  <section class="page-container pt-0" id="plugin-home-section" style="display:none">
    <div class="section-kicker">Platform extensions</div>
    <div class="plugin-widget-grid" id="plugin-home-widgets"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script>
    initI18n();
    (async () => {
      const user = await getMe();
      if (user) {
        document.getElementById('nav-profile').textContent = formatProfileLabel(user.username);
        document.getElementById('nav-profile-li').style.display = '';
        document.getElementById('nav-login-li').style.display = 'none';
        document.getElementById('nav-register-li').style.display = 'none';
        document.getElementById('nav-logout-li').style.display = '';
        await applyModeAwareNav();
        document.getElementById('hero-register').style.display = 'none';
        if (user.role === 'admin') document.getElementById('nav-admin').style.display = '';
      }
      await loadPluginWidgets();
    })();
    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }
    async function loadPluginWidgets() {
      const data = await apiFetch('/api/plugins').catch(() => null);
      if (!data) return;
      const widgets = Array.isArray(data.home_widgets) ? data.home_widgets : [];
      if (!widgets.length && Array.isArray(data.notifiers) && data.notifiers.includes('chat_notifier')) {
        widgets.push({
          name: 'chat_notifier',
          title: 'Chat Notifier',
          body: 'Solve and announcement notifications can be sent to Slack, Discord, or Telegram.',
          url: '/admin/plugins/chat-notifier',
        });
      }
      if (!widgets.length) return;
      const root = document.getElementById('plugin-home-widgets');
      root.innerHTML = widgets.map(w => `
        <article class="plugin-widget-card">
          <div class="plugin-widget-name">${escHtml(w.name || 'plugin')}</div>
          <h2>${escHtml(w.title || w.name || 'Plugin')}</h2>
          <p>${escHtml(w.body || '')}</p>
          ${w.url ? `<a class="btn btn-sm btn-outline-primary" href="${escHtml(w.url)}">Open</a>` : ''}
        </article>
      `).join('');
      document.getElementById('plugin-home-section').style.display = '';
    }
  </script>
</body>
</html>
