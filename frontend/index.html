<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heCsTackForse CTF</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" href="/scoreboard">Scoreboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" id="nav-admin" style="display:none"><a class="nav-link" href="/admin">Admin</a></li>
          <li class="nav-item" id="nav-profile-li" style="display:none"><a class="nav-link" href="/profile" id="nav-profile">Profile</a></li>
          <li class="nav-item" id="nav-login-li"><a class="nav-link" href="/login">Login</a></li>
          <li class="nav-item" id="nav-register-li"><a class="nav-link" href="/register">Register</a></li>
          <li class="nav-item" id="nav-logout-li" style="display:none"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="ctf-hero">
    <h1>Welcome to <span class="accent">heCsTackForse</span></h1>
    <p>A full-featured Capture The Flag platform with challenge deployment, Attack &amp; Defence mode, and dynamic scoring.</p>
    <div class="d-flex gap-3 flex-wrap justify-content-center">
      <a href="/challenges" class="btn btn-primary btn-lg px-4">View Challenges</a>
      <a href="/scoreboard" class="btn btn-outline-primary btn-lg px-4">Scoreboard</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    (async () => {
      const user = await getMe();
      if (user) {
        document.getElementById('nav-profile').textContent = user.username;
        document.getElementById('nav-profile-li').style.display = '';
        document.getElementById('nav-login-li').style.display = 'none';
        document.getElementById('nav-register-li').style.display = 'none';
        document.getElementById('nav-logout-li').style.display = '';
        if (user.role === 'admin') document.getElementById('nav-admin').style.display = '';
      }
    })();
    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }
  </script>
</body>
</html>
