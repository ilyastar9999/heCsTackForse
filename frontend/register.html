<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-i18n="nav.challenges" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.modules" href="/modules">Modules</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.scoreboard" href="/scoreboard">Scoreboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" data-i18n="nav.login" href="/login">Login</a></li>
          <li class="nav-item"><a class="nav-link active" data-i18n="nav.register" href="/register">Register</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><span id="lang-toggle-label">EN</span></a>
            <ul class="dropdown-menu dropdown-menu-end" style="min-width:120px">
              <li><a class="dropdown-item" href="#" onclick="setLang('en');return false">English</a></li>
              <li><a class="dropdown-item" href="#" onclick="setLang('ru');return false">Русский</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><span>heCsTackForse</span></div>
      <h2 data-i18n="register.title">Register</h2>
      <div id="error-msg" class="alert alert-danger d-none"></div>
      <form id="register-form">
        <div class="mb-3">
          <label class="form-label" data-i18n="register.username">Username</label>
          <input type="text" class="form-control" id="username" name="username" required autocomplete="username" data-i18n-placeholder="register.username" placeholder="Username">
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="register.email">Email</label>
          <input type="email" class="form-control" id="email" name="email" required autocomplete="email" placeholder="your@email.com">
        </div>
        <div class="mb-4">
          <label class="form-label" data-i18n="register.password">Password</label>
          <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password" data-i18n-placeholder="register.password" placeholder="Password">
        </div>
        <button type="submit" class="btn btn-primary w-100" data-i18n="register.submit">Register</button>
      </form>
      <p class="text-center mt-3 mb-0" style="color:var(--ctf-muted);font-size:.875rem">
        <span data-i18n="register.have_account">Already have an account?</span> <a href="/login" data-i18n="register.login">Sign In</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script>
    initI18n();
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('d-none');
      try {
        await apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ username, email, password }),
        });
        window.location.href = '/challenges';
      } catch (err) {
        errEl.textContent = err.message || 'Registration failed';
        errEl.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
