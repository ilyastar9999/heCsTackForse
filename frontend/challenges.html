<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenges – heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" href="/scoreboard">Scoreboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" id="nav-admin" style="display:none"><a class="nav-link" href="/admin">Admin</a></li>
          <li class="nav-item" id="nav-profile-li" style="display:none"><a class="nav-link" href="/profile" id="nav-profile">Profile</a></li>
          <li class="nav-item" id="nav-logout-li" style="display:none"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <h1 class="page-title">Challenges</h1>
    <div id="categories">
      <div class="loading-spinner">
        <div class="spinner-border text-secondary" role="status"></div>
        <p class="mt-2">Loading challenges…</p>
      </div>
    </div>
  </div>

  <!-- Challenge modal -->
  <div class="modal fade" id="challengeModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title mb-1" id="modal-title">–</h5>
            <div id="modal-meta" class="d-flex gap-2 flex-wrap"></div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modal-desc" class="mb-3" style="white-space:pre-wrap;color:var(--ctf-text)"></div>
          <div id="modal-instance" class="d-none mb-3"></div>
          <div id="modal-solved-notice" class="alert alert-success d-none">✓ You already solved this challenge!</div>
          <form id="flag-form" onsubmit="submitFlag(event)">
            <div class="mb-2">
              <label class="form-label">Flag</label>
              <div class="input-group">
                <input type="text" class="form-control" id="flag-input" placeholder="FLAG{...}" autocomplete="off">
                <button type="submit" class="btn btn-primary" id="submit-btn">Submit</button>
              </div>
            </div>
            <div id="flag-error" class="alert alert-danger d-none mt-2"></div>
            <div id="flag-success" class="alert alert-success d-none mt-2"></div>
          </form>
        </div>
        <div class="modal-footer" id="modal-footer">
          <span class="text-muted small" id="modal-solves"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/challenges.js"></script>
  <script>
    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login';
    }
    (async () => {
      const user = await getMe();
      if (!user) { location.href = '/login'; return; }
      document.getElementById('nav-profile').textContent = user.username;
      document.getElementById('nav-profile-li').style.display = '';
      document.getElementById('nav-logout-li').style.display = '';
      if (user.role === 'admin') document.getElementById('nav-admin').style.display = '';
      loadChallenges();
    })();
  </script>
</body>
</html>
