<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" href="/scoreboard">Scoreboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="/admin">Admin</a></li>
          <li class="nav-item"><a class="nav-link" href="/profile">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <h1 class="page-title">Admin Panel</h1>

    <ul class="nav nav-tabs mb-4">
      <li class="nav-item">
        <a class="nav-link active" href="#" onclick="showTab('challenges',this)">Challenges</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" onclick="showTab('users',this)">Users</a>
      </li>
    </ul>

    <!-- Challenges Tab -->
    <div id="tab-challenges">
      <div class="mb-3">
        <button class="btn btn-primary" onclick="openCreateChallenge()">+ New Challenge</button>
      </div>
      <div class="card p-0">
        <table class="admin-table">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Category</th><th>Points</th><th>Deploy</th><th>Visible</th><th>Actions</th></tr>
          </thead>
          <tbody id="challenges-body">
            <tr><td colspan="7" class="text-center py-3 text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Users Tab -->
    <div id="tab-users" style="display:none">
      <div class="card p-0">
        <table class="admin-table">
          <thead>
            <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Score</th><th>Actions</th></tr>
          </thead>
          <tbody id="users-body">
            <tr><td colspan="6" class="text-center py-3 text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Challenge Modal -->
  <div class="modal fade" id="ch-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="ch-modal-title">New Challenge</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="ch-form" onsubmit="saveChallengeForm(event)">
            <input type="hidden" id="ch-id">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" id="ch-name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" id="ch-category" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="ch-description" rows="4" required></textarea>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Points</label>
                <input type="number" class="form-control" id="ch-points" value="100" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Flag</label>
                <input type="text" class="form-control" id="ch-flag" required>
              </div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label">Flag Type</label>
                <select class="form-select" id="ch-flag-type">
                  <option value="static">Static</option>
                  <option value="regex">Regex</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Deploy Type</label>
                <select class="form-select" id="ch-deploy-type">
                  <option value="no_deploy">No Deploy</option>
                  <option value="single_instance">Single Instance</option>
                  <option value="per_user">Per User</option>
                  <option value="attack_defence">Attack &amp; Defence</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Deploy Backend</label>
                <select class="form-select" id="ch-deploy-backend">
                  <option value="">None</option>
                  <option value="docker">Docker</option>
                  <option value="kubernetes">Kubernetes</option>
                  <option value="pve">Proxmox VE</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Image</label>
              <input type="text" class="form-control" id="ch-image" placeholder="docker image or leave blank">
            </div>
            <div class="mb-3">
              <label class="form-label">Deploy Config (JSON)</label>
              <textarea class="form-control" id="ch-deploy-config" rows="2">{}</textarea>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="ch-visible" checked>
              <label class="form-check-label" for="ch-visible">Visible to players</label>
            </div>
            <div id="ch-error" class="alert alert-danger d-none"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" form="ch-form" class="btn btn-primary">Save Challenge</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    let chBsModal = null;

    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.href = '/login';
    }

    function showTab(name, el) {
      document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
      document.querySelectorAll('.nav-tabs .nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById('tab-' + name).style.display = '';
      el.classList.add('active');
      if (name === 'challenges') loadAdminChallenges();
      else if (name === 'users') loadAdminUsers();
    }

    async function loadAdminChallenges() {
      const challenges = await apiFetch('/api/admin/challenges');
      document.getElementById('challenges-body').innerHTML = challenges.map(c => `
        <tr>
          <td>${c.id}</td>
          <td>${escHtml(c.name)}</td>
          <td>${escHtml(c.category)}</td>
          <td>${c.points}</td>
          <td><span class="tag">${escHtml(c.deploy_type)}</span></td>
          <td>${c.is_visible ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>'}</td>
          <td>
            <button class="btn btn-sm btn-secondary me-1" onclick='editChallenge(${JSON.stringify(c)})'>Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteChallenge(${c.id})">Delete</button>
          </td>
        </tr>`).join('');
    }

    async function loadAdminUsers() {
      const users = await apiFetch('/api/admin/users');
      document.getElementById('users-body').innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${escHtml(u.username)}</td>
          <td>${escHtml(u.email)}</td>
          <td>
            <select class="form-select form-select-sm" onchange="updateUserRole(${u.id}, this.value, ${u.score})">
              <option${u.role==='user'?' selected':''} value="user">user</option>
              <option${u.role==='admin'?' selected':''} value="admin">admin</option>
            </select>
          </td>
          <td>${u.score}</td>
          <td><button class="btn btn-sm btn-secondary" onclick="promptScore(${u.id}, ${u.score}, '${escHtml(u.role)}')">Set Score</button></td>
        </tr>`).join('');
    }

    async function updateUserRole(id, role, score) {
      await apiFetch('/api/admin/users/' + id, { method: 'PUT', body: JSON.stringify({ role, score }) });
    }

    async function promptScore(id, currentScore, role) {
      const score = prompt('New score:', currentScore);
      if (score === null) return;
      await apiFetch('/api/admin/users/' + id, { method: 'PUT', body: JSON.stringify({ role, score: parseInt(score) }) });
      loadAdminUsers();
    }

    function openCreateChallenge() {
      document.getElementById('ch-modal-title').textContent = 'New Challenge';
      document.getElementById('ch-form').reset();
      document.getElementById('ch-id').value = '';
      document.getElementById('ch-deploy-config').value = '{}';
      document.getElementById('ch-visible').checked = true;
      document.getElementById('ch-error').classList.add('d-none');
      if (!chBsModal) chBsModal = new bootstrap.Modal(document.getElementById('ch-modal'));
      chBsModal.show();
    }

    function editChallenge(c) {
      document.getElementById('ch-modal-title').textContent = 'Edit Challenge';
      document.getElementById('ch-id').value = c.id;
      document.getElementById('ch-name').value = c.name;
      document.getElementById('ch-category').value = c.category;
      document.getElementById('ch-description').value = c.description;
      document.getElementById('ch-points').value = c.points;
      document.getElementById('ch-flag').value = c.flag;
      document.getElementById('ch-flag-type').value = c.flag_type;
      document.getElementById('ch-deploy-type').value = c.deploy_type;
      document.getElementById('ch-deploy-backend').value = c.deploy_backend;
      document.getElementById('ch-image').value = c.image;
      document.getElementById('ch-deploy-config').value = c.deploy_config;
      document.getElementById('ch-visible').checked = c.is_visible;
      document.getElementById('ch-error').classList.add('d-none');
      if (!chBsModal) chBsModal = new bootstrap.Modal(document.getElementById('ch-modal'));
      chBsModal.show();
    }

    async function saveChallengeForm(e) {
      e.preventDefault();
      const id = document.getElementById('ch-id').value;
      const body = {
        name: document.getElementById('ch-name').value,
        category: document.getElementById('ch-category').value,
        description: document.getElementById('ch-description').value,
        points: parseInt(document.getElementById('ch-points').value),
        flag: document.getElementById('ch-flag').value,
        flag_type: document.getElementById('ch-flag-type').value,
        deploy_type: document.getElementById('ch-deploy-type').value,
        deploy_backend: document.getElementById('ch-deploy-backend').value,
        image: document.getElementById('ch-image').value,
        deploy_config: document.getElementById('ch-deploy-config').value,
        is_visible: document.getElementById('ch-visible').checked,
      };
      const errEl = document.getElementById('ch-error');
      errEl.classList.add('d-none');
      try {
        if (id) {
          await apiFetch('/api/admin/challenges/' + id, { method: 'PUT', body: JSON.stringify(body) });
        } else {
          await apiFetch('/api/admin/challenges', { method: 'POST', body: JSON.stringify(body) });
        }
        chBsModal.hide();
        loadAdminChallenges();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('d-none');
      }
    }

    async function deleteChallenge(id) {
      if (!confirm('Delete challenge ' + id + '?')) return;
      await apiFetch('/api/admin/challenges/' + id, { method: 'DELETE' });
      loadAdminChallenges();
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    (async () => {
      const user = await getMe();
      if (!user || user.role !== 'admin') { location.href = '/'; return; }
      loadAdminChallenges();
    })();
  </script>
</body>
</html>
