<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page – heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-i18n="nav.challenges" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.modules" href="/modules">Modules</a></li>
          <li class="nav-item"><a class="nav-link" data-i18n="nav.scoreboard" href="/scoreboard">Scoreboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" id="nav-admin" style="display:none"><a class="nav-link" data-i18n="nav.admin" href="/admin">Admin</a></li>
          <li class="nav-item" id="nav-profile-li" style="display:none"><a class="nav-link" href="/profile" id="nav-profile">Profile</a></li>
          <li class="nav-item" id="nav-login-li"><a class="nav-link" data-i18n="nav.login" href="/login">Login</a></li>
          <li class="nav-item" id="nav-register-li"><a class="nav-link" data-i18n="nav.register" href="/register">Register</a></li>
          <li class="nav-item" id="nav-logout-li" style="display:none"><a class="nav-link" data-i18n="nav.logout" href="#" onclick="logout()">Logout</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><span id="lang-toggle-label">EN</span></a>
            <ul class="dropdown-menu dropdown-menu-end" style="min-width:120px">
              <li><a class="dropdown-item" href="#" onclick="setLang('en');return false">English</a></li>
              <li><a class="dropdown-item" href="#" onclick="setLang('ru');return false">Русский</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-container" id="page-content">
    <div class="loading-spinner">
      <div class="spinner-border text-secondary" role="status"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/marked.min.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script>
    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    (async () => {
      await initI18n();
      const user = await getMe();
      if (user) {
        document.getElementById('nav-profile').textContent = formatProfileLabel(user.username);
        document.getElementById('nav-profile-li').style.display = '';
        document.getElementById('nav-login-li').style.display = 'none';
        document.getElementById('nav-register-li').style.display = 'none';
        document.getElementById('nav-logout-li').style.display = '';
        if (user.role === 'admin') document.getElementById('nav-admin').style.display = '';
      }

      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const container = document.getElementById('page-content');

      if (!slug) {
        container.innerHTML = `<div class="alert alert-warning">${t('pages.not_found')}</div>`;
        return;
      }

      try {
        const page = await apiFetch('/api/pages/' + encodeURIComponent(slug));
        document.title = escHtml(page.title) + ' – heCsTackForse';
        const rendered = window.marked ? marked.parse(page.content || '') : escHtml(page.content || '');
        container.innerHTML = `
          <h1 class="page-title">${escHtml(page.title)}</h1>
          <div class="card p-4">
            <div id="page-body" class="markdown-body">${sanitizeHtml(rendered)}</div>
          </div>`;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${t('pages.not_found')}</div>`;
      }
    })();
  </script>
</body>
</html>
