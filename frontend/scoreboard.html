<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard – heCsTackForse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">heCsTackForse</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-i18n="nav.challenges" href="/challenges">Challenges</a></li>
          <li class="nav-item"><a class="nav-link active" data-i18n="nav.scoreboard" href="/scoreboard">Scoreboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" id="nav-admin" style="display:none"><a class="nav-link" data-i18n="nav.admin" href="/admin">Admin</a></li>
          <li class="nav-item" id="nav-profile-li" style="display:none"><a class="nav-link" href="/profile" id="nav-profile">Profile</a></li>
          <li class="nav-item" id="nav-login-li"><a class="nav-link" data-i18n="nav.login" href="/login">Login</a></li>
          <li class="nav-item" id="nav-register-li"><a class="nav-link" data-i18n="nav.register" href="/register">Register</a></li>
          <li class="nav-item" id="nav-logout-li" style="display:none"><a class="nav-link" data-i18n="nav.logout" href="#" onclick="logout()">Logout</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><span id="lang-toggle-label">EN</span></a>
            <ul class="dropdown-menu dropdown-menu-end" style="min-width:120px">
              <li><a class="dropdown-item" href="#" onclick="setLang('en');return false">English</a></li>
              <li><a class="dropdown-item" href="#" onclick="setLang('ru');return false">Русский</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <h1 class="page-title mb-0" data-i18n="scoreboard.title">Scoreboard</h1>
      <div class="form-check form-switch" id="admin-filter-wrap" style="display:none!important">
        <input class="form-check-input" type="checkbox" id="show-admins" onchange="filterScoreboard()">
        <label class="form-check-label text-muted" for="show-admins" data-i18n="scoreboard.show_admins">Show admin users</label>
      </div>
    </div>
    <div class="card">
      <div class="card-body p-0">
        <table class="scoreboard-table">
          <thead>
            <tr>
              <th style="width:60px" data-i18n="scoreboard.rank">#</th>
              <th data-i18n="scoreboard.player">Name</th>
              <th style="width:100px" data-i18n="scoreboard.solves">Solves</th>
              <th style="width:120px" data-i18n="scoreboard.score">Score</th>
            </tr>
          </thead>
          <tbody id="scoreboard-body">
            <tr><td colspan="4" class="text-center py-4 text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/scoreboard.js"></script>
  <script>
    async function logout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }
    (async () => {
      await initI18n();
      const user = await getMe();
      if (user) {
        document.getElementById('nav-profile').textContent = formatProfileLabel(user.username);
        document.getElementById('nav-profile-li').style.display = '';
        document.getElementById('nav-login-li').style.display = 'none';
        document.getElementById('nav-register-li').style.display = 'none';
        document.getElementById('nav-logout-li').style.display = '';
        if (user.role === 'admin') {
          document.getElementById('nav-admin').style.display = '';
          // Show the admin filter toggle for admins
          document.getElementById('admin-filter-wrap').style.setProperty('display', '', 'important');
        }
      }
    })();
  </script>
</body>
</html>
